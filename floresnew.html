    <style>
      /* FORZAR ESTILOS SOBRE MAIN.CSS CON !IMPORTANT */
      .containerbur {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        overflow: hidden !important;
        pointer-events: none !important;
        z-index: 2 !important; /* Por encima del fondo pero sin tapar el texto */
      }

      .bubbles {
        position: relative !important;
        display: flex !important;
        justify-content: space-around !important;
        width: 100% !important;
        height: 100% !important;
      }

      /* Contenedor de cada farolito */
      .bubbles span {
        position: absolute !important;
        bottom: -60px !important;
        left: calc(var(--i) * 3.5% + 2%) !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: calc(30px + (var(--i) * 0.9px)) !important;
        height: calc(30px + (var(--i) * 0.9px)) !important;
        border-radius: 50% !important;
        /* Aura cálida dorada/naranja bien visible */
        background: radial-gradient(circle, rgba(255, 235, 130, 0.95) 15%, rgba(255, 170, 0, 0.5) 55%, transparent 75%) !important;
        box-shadow: 0 0 20px rgba(255, 200, 50, 0.9), 0 0 40px rgba(255, 130, 0, 0.5) !important;
        animation: subirFarol calc(25s + (var(--i) * 1.2s)) linear infinite !important;
        animation-delay: calc(var(--i) * -0.8s) !important;
      }

      /* Imagen del sol/farol dentro del brillo */
      .bubbles span img {
        width: 75% !important;
        height: 75% !important;
        object-fit: contain !important;
        filter: drop-shadow(0 0 8px #ffd000) brightness(1.3) !important;
        animation: balanceoFarol 3.5s ease-in-out infinite alternate !important;
      }

      /* Ascenso lento, ondulado y continuo */
      @keyframes subirFarol {
        0% {
          transform: translateY(0) translateX(0) scale(0.65);
          opacity: 0;
        }
        12% {
          opacity: 0.95;
        }
        50% {
          transform: translateY(-55vh) translateX(30px) scale(1.05);
          opacity: 1;
        }
        88% {
          opacity: 0.95;
        }
        100% {
          transform: translateY(-115vh) translateX(-25px) scale(0.7);
          opacity: 0;
        }
      }

      /* Suave oscilación y cambio de brillo */
      @keyframes balanceoFarol {
        0% {
          transform: rotate(-6deg) scale(0.95);
          filter: drop-shadow(0 0 6px #ffbe1a) brightness(1.1);
        }
        100% {
          transform: rotate(6deg) scale(1.08);
          filter: drop-shadow(0 0 16px #fff385) brightness(1.4);
        }
      }
    </style>

    <!-- Transición suave de frases -->
    <script>
      const frases = [
        "Que estas flores amarillas te recuerden siempre lo especial y valiosa que eres",
        "Gracias por tu amistad y por siempre brindar una gran energía",
        "Nunca dudes de tu potencial, eres capaz de lograr todo lo que te propongas",
        "Que tu día esté lleno de luz, sonrisas y momentos increíbles",
        "Recuerda que cuentas conmigo siempre, ¡sigue brillando con fuerza!"
      ];

      let indice = 0;
      const elementoTexto = document.getElementById("texto-mensaje");

      setInterval(() => {
        elementoTexto.style.opacity = "0";
        elementoTexto.style.transform = "translateY(-14px) scale(0.97)";
        
        setTimeout(() => {
          indice = (indice + 1) % frases.length;
          elementoTexto.textContent = frases[indice];
          
          elementoTexto.style.transition = "none";
          elementoTexto.style.transform = "translateY(14px) scale(0.97)";
          
          void elementoTexto.offsetWidth;
          
          elementoTexto.style.transition = "opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), transform 1.5s cubic-bezier(0.4, 0, 0.2, 1)";
          elementoTexto.style.opacity = "1";
          elementoTexto.style.transform = "translateY(0) scale(1)";
        }, 1500);
      }, 5500);
