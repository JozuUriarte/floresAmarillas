    <style>
      /* --- MEJORA DE LOS FLOTADORES / FAROLES --- */
      .containerbur {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        pointer-events: none;
        z-index: 1;
      }

      .bubbles {
        position: relative;
        display: flex;
        justify-content: space-around;
        width: 100%;
        height: 100%;
      }

      .bubbles span {
        position: relative;
        bottom: -50px;
        display: inline-block;
        /* Animación suave de elevación y oscilación */
        animation: flotarFarol calc(120s / var(--i)) linear infinite;
      }

      .bubbles span img {
        width: calc(24px + (var(--i) * 0.8px));
        height: auto;
        /* Brillo dorado intenso tipo linterna/farol */
        filter: drop-shadow(0 0 10px rgba(255, 220, 110, 0.95)) 
                drop-shadow(0 0 25px rgba(255, 175, 50, 0.75))
                brightness(1.2);
        animation: pulsoLuz calc(2s + (var(--i) * 0.15s)) ease-in-out infinite alternate;
        opacity: 0.85;
      }

      /* Ascenso suave con vaivén horizontal natural */
      @keyframes flotarFarol {
        0% {
          transform: translateY(0) translateX(0) scale(0.7);
          opacity: 0;
        }
        10% {
          opacity: 0.9;
        }
        50% {
          transform: translateY(-50vh) translateX(25px) scale(1);
        }
        90% {
          opacity: 0.9;
        }
        100% {
          transform: translateY(-110vh) translateX(-25px) scale(0.65);
          opacity: 0;
        }
      }

      /* Efecto de encendido y titileo cálido */
      @keyframes pulsoLuz {
        0% {
          filter: drop-shadow(0 0 6px rgba(255, 215, 90, 0.7)) 
                  drop-shadow(0 0 14px rgba(255, 160, 40, 0.5))
                  brightness(1);
          transform: scale(0.92);
        }
        100% {
          filter: drop-shadow(0 0 16px rgba(255, 240, 150, 1)) 
                  drop-shadow(0 0 32px rgba(255, 190, 60, 0.9))
                  brightness(1.35);
          transform: scale(1.08);
        }
      }

    <!-- Transición suave de frases -->
    <script>
      const frases = [
        "Que estas flores amarillas te recuerden siempre lo especial y valiosa que eres",
        "Gracias por tu amistad y por siempre brindar una gran energía",
        "Nunca dudes de tu potencial, eres capaz de lograr todo lo que te propongas",
        "Que tu día esté lleno de luz, sonrisas y momentos increíbles",
        "Recuerda que cuentas conmigo siempre, ¡sigue brillando con fuerza!"
      ];

      let indice = 0;
      const elementoTexto = document.getElementById("texto-mensaje");

      setInterval(() => {
        elementoTexto.style.opacity = "0";
        elementoTexto.style.transform = "translateY(-14px) scale(0.97)";
        
        setTimeout(() => {
          indice = (indice + 1) % frases.length;
          elementoTexto.textContent = frases[indice];
          
          elementoTexto.style.transition = "none";
          elementoTexto.style.transform = "translateY(14px) scale(0.97)";
          
          void elementoTexto.offsetWidth;
          
          elementoTexto.style.transition = "opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1), transform 1.5s cubic-bezier(0.4, 0, 0.2, 1)";
          elementoTexto.style.opacity = "1";
          elementoTexto.style.transform = "translateY(0) scale(1)";
        }, 1500);
      }, 5500);
